<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Inicio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #07090e;
            color: #f3f4f6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ambient Glows */
        .glow-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        .glow-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(18, 22, 31, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .glass-input:focus-within {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(129, 140, 248, 0.6);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }

        .shortcut-item {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .shortcut-item:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-4 sm:p-6 min-h-screen relative selection:bg-indigo-500 selection:text-white">

    <!-- Ambient background effects -->
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <!-- Top Header / Time Section -->
    <header class="w-full max-w-md mx-auto text-center mt-6 sm:mt-12 z-10">
        <h1 id="time" class="text-5xl sm:text-6xl font-extrabold tracking-tight text-white mb-2 font-mono">00:00</h1>
        <p id="date" class="text-sm sm:text-base font-medium text-gray-400 capitalize">Cargando fecha...</p>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-md mx-auto flex-1 flex flex-col justify-center my-8 z-10 space-y-6">

        <!-- Search Bar Component -->
        <form id="search-form" action="https://www.google.com/search" method="GET" class="w-full">
            <div class="glass-input rounded-2xl flex items-center px-4 py-3 sm:py-4 gap-3">
                
                <!-- Engine Selector Dropdown -->
                <div class="relative">
                    <button type="button" id="engine-btn" class="flex items-center gap-1 text-gray-400 hover:text-white transition-colors focus:outline-none">
                        <i id="engine-icon" data-lucide="search" class="w-5 h-5 text-indigo-400"></i>
                        <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-gray-500"></i>
                    </button>
                    <!-- Engine Options Dropdown Menu -->
                    <div id="engine-menu" class="hidden absolute left-0 mt-3 w-40 glass-card rounded-xl py-2 z-50 border border-gray-800 shadow-2xl">
                        <button type="button" data-engine="google" class="w-full px-4 py-2 text-left text-xs text-gray-300 hover:bg-white/10 flex items-center gap-2">
                            <i data-lucide="search" class="w-4 h-4 text-indigo-400"></i> Google
                        </button>
                        <button type="button" data-engine="youtube" class="w-full px-4 py-2 text-left text-xs text-gray-300 hover:bg-white/10 flex items-center gap-2">
                            <i data-lucide="youtube" class="w-4 h-4 text-red-500"></i> YouTube
                        </button>
                        <button type="button" data-engine="duckduckgo" class="w-full px-4 py-2 text-left text-xs text-gray-300 hover:bg-white/10 flex items-center gap-2">
                            <i data-lucide="shield" class="w-4 h-4 text-orange-400"></i> DuckDuckGo
                        </button>
                    </div>
                </div>

                <!-- Search Input Field -->
                <input 
                    type="text" 
                    name="q" 
                    id="search-input" 
                    placeholder="Buscar en la web..." 
                    autocomplete="off" 
                    required 
                    class="w-full bg-transparent text-white placeholder-gray-500 focus:outline-none text-base font-normal"
                >

                <!-- Submit / Clear Action -->
                <button type="submit" class="p-1.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/10 transition-colors">
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </div>
        </form>

        <!-- Shortcuts / Bookmarks Grid -->
        <section class="glass-card rounded-3xl p-5 border border-white/5">
            <div class="flex items-center justify-between mb-4 px-1">
                <span class="text-xs font-semibold uppercase tracking-wider text-gray-400 flex items-center gap-2">
                    <i data-lucide="bookmark" class="w-3.5 h-3.5 text-indigo-400"></i> Accesos Directos
                </span>
                <button id="add-shortcut-btn" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1 font-medium transition-colors">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i> Agregar
                </button>
            </div>

            <!-- Grid Container for Shortcuts -->
            <div id="shortcuts-container" class="grid grid-cols-4 gap-3">
                <!-- Shortcuts dynamically loaded via JavaScript -->
            </div>
        </section>

    </main>

    <!-- Modal for Adding New Shortcut -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card rounded-3xl p-6 w-full max-w-sm border border-gray-800 space-y-4">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                <i data-lucide="link-2" class="w-5 h-5 text-indigo-400"></i> Nuevo Acceso
            </h3>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Nombre</label>
                    <input type="text" id="shortcut-title" placeholder="Ej: Twitter" class="w-full glass-input rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">URL (Dirección web)</label>
                    <input type="url" id="shortcut-url" placeholder="https://..." class="w-full glass-input rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button type="button" id="cancel-modal-btn" class="px-4 py-2 rounded-xl text-xs font-medium text-gray-400 hover:text-white hover:bg-white/5">Cancelar</button>
                <button type="button" id="save-shortcut-btn" class="px-4 py-2 rounded-xl text-xs font-medium bg-indigo-600 hover:bg-indigo-500 text-white transition-colors">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Footer Status -->
    <footer class="w-full text-center pb-4 z-10">
        <p class="text-xs text-gray-600">Inicio Personalizado</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // --- Clock Logic ---
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time').textContent = `${hours}:${minutes}`;

            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('es-ES', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- Search Engine Dropdown Switcher ---
        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');
        const engineBtn = document.getElementById('engine-btn');
        const engineMenu = document.getElementById('engine-menu');
        const engineIcon = document.getElementById('engine-icon');

        const engines = {
            google: { action: 'https://www.google.com/search', query: 'q', icon: 'search', color: 'text-indigo-400' },
            youtube: { action: 'https://www.youtube.com/results', query: 'search_query', icon: 'youtube', color: 'text-red-500' },
            duckduckgo: { action: 'https://duckduckgo.com/', query: 'q', icon: 'shield', color: 'text-orange-400' }
        };

        engineBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            engineMenu.classList.toggle('hidden');
        });

        document.addEventListener('click', () => engineMenu.classList.add('hidden'));

        engineMenu.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                const selected = btn.getAttribute('data-engine');
                const config = engines[selected];
                
                searchForm.action = config.action;
                searchInput.name = config.query;
                engineIcon.setAttribute('data-lucide', config.icon);
                engineIcon.className = `w-5 h-5 ${config.color}`;
                lucide.createIcons();
                
                engineMenu.classList.add('hidden');
            });
        });

        // --- Shortcuts Management (LocalStorage) ---
        const defaultShortcuts = [
            { title: 'YouTube', url: 'https://youtube.com', icon: 'youtube' },
            { title: 'GitHub', url: 'https://github.com', icon: 'github' },
            { title: 'Reddit', url: 'https://reddit.com', icon: 'message-square' },
            { title: 'Twitch', url: 'https://twitch.tv', icon: 'tv' }
        ];

        function getShortcuts() {
            const saved = localStorage.getItem('custom_shortcuts');
            return saved ? JSON.parse(saved) : defaultShortcuts;
        }

        function saveShortcuts(list) {
            localStorage.setItem('custom_shortcuts', JSON.stringify(list));
        }

        function renderShortcuts() {
            const container = document.getElementById('shortcuts-container');
            container.innerHTML = '';
            const list = getShortcuts();

            list.forEach((shortcut, index) => {
                const domain = new URL(shortcut.url).hostname;
                const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

                const el = document.createElement('div');
                el.className = 'relative group';
                el.innerHTML = `
                    <a href="${shortcut.url}" class="shortcut-item glass-card border border-white/5 rounded-2xl p-3 flex flex-col items-center justify-center text-center gap-2">
                        <img src="${faviconUrl}" alt="${shortcut.title}" class="w-7 h-7 rounded-lg object-contain" onerror="this.src='https://placehold.co/64x64/1e293b/ffffff?text=${shortcut.title[0]}'">
                        <span class="text-[11px] font-medium text-gray-300 truncate w-full">${shortcut.title}</span>
                    </a>
                    <button onclick="deleteShortcut(${index})" class="absolute -top-1 -right-1 bg-red-500/80 hover:bg-red-600 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                `;
                container.appendChild(el);
            });
            lucide.createIcons();
        }

        function deleteShortcut(index) {
            const list = getShortcuts();
            list.splice(index, 1);
            saveShortcuts(list);
            renderShortcuts();
        }

        // --- Modal Logic ---
        const modal = document.getElementById('modal-overlay');
        const addBtn = document.getElementById('add-shortcut-btn');
        const cancelBtn = document.getElementById('cancel-modal-btn');
        const saveBtn = document.getElementById('save-shortcut-btn');

        addBtn.addEventListener('click', () => modal.classList.remove('hidden'));
        cancelBtn.addEventListener('click', () => modal.classList.add('hidden'));

        saveBtn.addEventListener('click', () => {
            const titleInput = document.getElementById('shortcut-title');
            const urlInput = document.getElementById('shortcut-url');

            let title = titleInput.value.trim();
            let url = urlInput.value.trim();

            if (!url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            if (!title) {
                title = new URL(url).hostname.replace('www.', '');
            }

            const list = getShortcuts();
            list.push({ title, url });
            saveShortcuts(list);
            renderShortcuts();

            titleInput.value = '';
            urlInput.value = '';
            modal.classList.add('hidden');
        });

        // Initial Load
        renderShortcuts();
    </script>
</body>
</html>
